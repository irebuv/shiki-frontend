services:
  frontend:
    build: .
    container_name: my-app-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8000/api"
      VITE_JWT_STORAGE_KEY: "token"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  node_modules:

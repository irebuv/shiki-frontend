name: shiki-frontend

services:
  frontend:
    image: node:20-alpine
    container_name: shiki-frontend
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "5175:5175"
    environment:
      VITE_API_URL: "http://localhost:8082/api"
      VITE_JWT_STORAGE_KEY: "token"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5175"
